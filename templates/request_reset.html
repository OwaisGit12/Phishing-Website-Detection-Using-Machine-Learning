<!DOCTYPE html>
<html>
<head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/></head>
<body style="font-family:Poppins,Inter;padding:28px;background:linear-gradient(120deg,#071029,#0f2138);color:#fff;">
  <div style="max-width:420px;margin:0 auto;background:rgba(255,255,255,0.02);padding:20px;border-radius:12px;">
    <h3>Request password reset</h3>
    <form method="post" action="/request_reset">
      <input type="email" name="email" placeholder="Your account email" required style="width:100%;padding:10px;margin:8px 0;border-radius:8px;border:none;">
      <button style="padding:10px 12px;border-radius:8px;border:none;background:linear-gradient(90deg,#00c3ff,#5fe0ff);color:#022;">Request reset</button>
    </form>
  </div>
</body>
</html>

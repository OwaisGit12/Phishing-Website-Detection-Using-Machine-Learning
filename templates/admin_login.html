<!DOCTYPE html>
<html>
<head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/></head>
<body style="font-family:Poppins,Inter;background:linear-gradient(120deg,#071029,#0f2138);color:#fff;display:flex;align-items:center;justify-content:center;height:100vh;margin:0">
  <div style="background:rgba(255,255,255,0.02);padding:22px;border-radius:12px;width:360px;text-align:center">
    <h2>Admin Login</h2>
    <form method="post" action="/admin/login">
      <input name="username" placeholder="Username" required style="width:100%;padding:10px;margin:8px 0;border-radius:8px;border:none">
      <input name="password" placeholder="Password" type="password" required style="width:100%;padding:10px;margin:8px 0;border-radius:8px;border:none">
      <button style="padding:10px 12px;border-radius:8px;border:none;background:linear-gradient(90deg,#00c3ff,#5fe0ff);color:#022;font-weight:700">Login</button>
    </form>
  </div>
</body>
</html>
